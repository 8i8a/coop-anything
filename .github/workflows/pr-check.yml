# Automated rule-based review comment on every pull request (free, no AI).
# Safety: runs from the base branch (pull_request_target) and uses the base branch's
# tools/pr_check.py. It never checks out or runs the PR's code; it reads the diff as text
# and posts one comment. It cannot merge or push. A maintainer still decides.
name: pr-check
on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4   # base branch only, for tools/pr_check.py
      - name: Check the PR
        run: |
          gh pr diff "$PR" --repo "$REPO" > diff.txt || true
          gh pr view "$PR" --repo "$REPO" --json files > files.json
          author=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login)
          created=$(gh api "users/$author" --jq .created_at || true)
          python3 tools/pr_check.py diff.txt files.json "$created" > comment.md
          cat comment.md
      - name: Post or update the comment
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- pr-check -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          fi
